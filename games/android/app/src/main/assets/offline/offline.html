<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>FREEPLAY - Offline Retro Arcade</title>
  <style>
    :root {
      --bg: #070A12;
      --card-bg: #0F1523;
      --card-hover: #161F33;
      --border: #1F293D;
      --accent: #A855F7;
      --accent-glow: rgba(168, 85, 247, 0.25);
      --cyan: #22D3EE;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --danger: #EF4444;
      --warn: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Screen */
    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 10, 18, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: max(12px, env(safe-area-inset-top, 12px)) 16px 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #7E22CE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .logo-badge svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-offline {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--warn);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #7E22CE 100%);
      border-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-cyan {
      background: rgba(34, 211, 238, 0.15);
      border-color: rgba(34, 211, 238, 0.3);
      color: var(--cyan);
    }

    /* Sub-bar / Search / Filters */
    .controls-bar {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 21, 35, 0.4);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-pill {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill strong {
      color: var(--accent);
      font-weight: 700;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .search-input-wrap {
      position: relative;
      width: 100%;
    }

    .search-input-wrap input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
      transition: border 0.15s;
    }

    .search-input-wrap input:focus {
      border-color: var(--accent);
    }

    .search-input-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: var(--text-muted);
      pointer-events-none;
    }

    /* Grid */
    main {
      flex: 1;
      padding: 16px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    @media (min-width: 600px) {
      .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      cursor: pointer;
      position: relative;
    }

    .game-card:hover {
      border-color: rgba(168, 85, 247, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .cover-container {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(15, 21, 35, 0.9) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .cover-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--accent);
    }

    .play-overlay-icon {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      opacity: 0.9;
      transition: transform 0.15s;
    }

    .game-card:hover .play-overlay-icon {
      transform: scale(1.1);
      background: var(--accent);
    }

    .console-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(168, 85, 247, 0.85);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .game-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .game-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .size-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Empty state */
    .empty-state {
      padding: 60px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .empty-icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Emulator container modal */
    #emulatorModal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: none;
      flex-direction: column;
    }

    #emulatorModal.active {
      display: flex;
    }

    .emu-top-bar {
      padding: max(10px, env(safe-area-inset-top, 10px)) 16px 10px 16px;
      background: rgba(15, 21, 35, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .emu-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .emu-frame-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 21, 35, 0.95);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      z-index: 2000;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Offline Game Library -->
  <div id="libraryScreen" class="screen">
    <!-- Header -->
    <header>
      <div class="brand-wrap">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24"><polygon points="6 2 18 2 18 6 6 6 6 2"/><polygon points="2 6 22 6 22 18 2 18 2 6"/><polygon points="6 18 18 18 18 22 6 22 6 18"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/><rect x="11" y="9" width="2" height="6"/><rect x="9" y="11" width="6" height="2"/></svg>
        </div>
        <div class="brand-title">
          FREEPLAY
          <span class="badge-offline">Offline Games</span>
        </div>
      </div>

      <div class="header-actions">
        <input type="file" id="localRomPicker" accept=".nes,.sfc,.smc,.gba,.gb,.gbc,.bin,.md,.gen,.zip" style="display:none;" onchange="handleLocalRomPick(event)" />
        <button class="btn btn-cyan" onclick="document.getElementById('localRomPicker').click()" title="Load ROM file from device">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Load ROM</span>
        </button>

        <button class="btn" onclick="reconnectToCloud()" title="Connect to online server">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Cloud</span>
        </button>
      </div>
    </header>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="stats-row">
        <div class="stat-pill" id="storageSummary">
          <span>Scanning offline storage...</span>
        </div>

        <div class="filter-tabs" id="consoleFilterTabs">
          <button class="tab-btn active" data-filter="all" onclick="setConsoleFilter('all')">All (<span id="countAll">0</span>)</button>
        </div>
      </div>

      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search saved retro games..." oninput="handleSearch(this.value)" />
      </div>
    </div>

    <!-- Main Game Grid -->
    <main>
      <div id="gameGrid" class="game-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon-wrap">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/><line x1="11" y1="12" x2="13" y2="12"/><line x1="12" y1="11" x2="12" y2="13"/></svg>
        </div>
        <h2 style="font-size:1.2rem; font-weight:800;">No Games Saved for Offline Play</h2>
        <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.6;">
          When online, play or favorite games from your FREEPLAY cloud library to download them for offline gaming. Or load any ROM file from your phone storage below!
        </p>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button class="btn btn-cyan" onclick="document.getElementById('localRomPicker').click()">
            Load ROM from Phone
          </button>
          <button class="btn btn-primary" onclick="reconnectToCloud()">
            Go Online
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Screen 2: Emulator Modal -->
  <div id="emulatorModal">
    <div class="emu-top-bar">
      <div class="emu-title" id="emuGameTitle">Game Title</div>
      <button class="btn btn-danger" onclick="closeEmulator()">Exit Game</button>
    </div>
    <div class="emu-frame-wrap" id="emuContainer">
      <div id="emuMessage" style="color:var(--text-muted); text-align:center; padding:20px;">
        Starting game...
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Notice message</div>

  <script>
    const DB_NAME = 'Freeplay_OfflineGames_DB';
    const STORE_NAME = 'roms';
    const USER_KEY = 'freeplay.offline.user';
    const GAMES_KEY = 'freeplay.offline.games';

    let db = null;
    let offlineGamesList = [];
    let activeConsoleFilter = 'all';
    let searchQuery = '';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE_NAME)) {
            req.result.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => {
          db = req.result;
          resolve(db);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function scanOfflineGames() {
      if (!db) await openDB();

      // Read ROM keys stored in IndexedDB
      const romKeys = await new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });

      // Read cached games metadata from localStorage
      let cachedGames = [];
      try {
        cachedGames = JSON.parse(localStorage.getItem(GAMES_KEY) || '[]');
      } catch (_) {}

      const romKeySet = new Set(romKeys);
      offlineGamesList = [];

      cachedGames.forEach(g => {
        // cache keys in offlineGames.js are formatted `${userId}:gameId`
        const matches = romKeys.some(k => String(k).endsWith(':' + g.id) || k === g.id);
        if (matches) {
          offlineGamesList.push({
            id: g.id,
            title: g.title || g.name || g.filename,
            console: (g.console || 'arcade').toLowerCase(),
            filename: g.filename,
            sizeBytes: g.sizeBytes || 0,
            driveId: g.driveId
          });
        }
      });

      // If romKeys has records not in cachedGames (e.g. manually imported), add them
      romKeys.forEach(k => {
        const parts = String(k).split(':');
        const id = parts[parts.length - 1];
        if (!offlineGamesList.some(g => g.id === id)) {
          offlineGamesList.push({
            id: id,
            title: id.replace(/[_-]/g, ' '),
            console: 'retro',
            filename: `${id}.bin`,
            sizeBytes: 0,
            storageKey: k
          });
        }
      });

      renderLibrary();
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return 'ROM file';
      const mb = bytes / (1024 * 1024);
      if (mb >= 1) return mb.toFixed(1) + ' MB';
      return (bytes / 1024).toFixed(0) + ' KB';
    }

    function setConsoleFilter(consoleName) {
      activeConsoleFilter = consoleName;
      document.querySelectorAll('#consoleFilterTabs .tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === consoleName);
      });
      renderLibrary();
    }

    function handleSearch(val) {
      searchQuery = (val || '').toLowerCase().trim();
      renderLibrary();
    }

    function renderLibrary() {
      const grid = document.getElementById('gameGrid');
      const emptyState = document.getElementById('emptyState');
      const storageSummary = document.getElementById('storageSummary');
      const filterTabsContainer = document.getElementById('consoleFilterTabs');

      // Compute consoles
      const consoleCounts = {};
      offlineGamesList.forEach(g => {
        consoleCounts[g.console] = (consoleCounts[g.console] || 0) + 1;
      });

      let tabsHtml = `<button class="tab-btn ${activeConsoleFilter === 'all' ? 'active' : ''}" data-filter="all" onclick="setConsoleFilter('all')">All (<span id="countAll">${offlineGamesList.length}</span>)</button>`;
      Object.entries(consoleCounts).sort().forEach(([cName, count]) => {
        tabsHtml += `<button class="tab-btn ${activeConsoleFilter === cName ? 'active' : ''}" data-filter="${cName}" onclick="setConsoleFilter('${cName}')">${cName.toUpperCase()} (${count})</button>`;
      });
      filterTabsContainer.innerHTML = tabsHtml;

      storageSummary.innerHTML = `<strong>${offlineGamesList.length}</strong> games saved offline`;

      let filtered = offlineGamesList.filter(g => {
        if (activeConsoleFilter !== 'all' && g.console !== activeConsoleFilter) return false;
        if (searchQuery) {
          const t = (g.title || '').toLowerCase();
          const f = (g.filename || '').toLowerCase();
          if (!t.includes(searchQuery) && !f.includes(searchQuery)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'flex';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = '';

      filtered.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="cover-container">
            <span class="console-tag">${g.console}</span>
            <div class="cover-fallback">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/><line x1="11" y1="12" x2="13" y2="12"/><line x1="12" y1="11" x2="12" y2="13"/></svg>
            </div>
            <div class="play-overlay-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
          </div>
          <div class="card-info">
            <div class="game-title">${g.title}</div>
            <div class="game-sub">${g.console.toUpperCase()}</div>
            <div class="card-footer">
              <span class="size-tag">${formatBytes(g.sizeBytes)}</span>
            </div>
          </div>
        `;
        card.onclick = () => launchGame(g);
        grid.appendChild(card);
      });
    }

    async function launchGame(game) {
      document.getElementById('emuGameTitle').textContent = game.title;
      document.getElementById('emulatorModal').classList.add('active');

      const emuContainer = document.getElementById('emuContainer');
      emuContainer.innerHTML = `<div style="text-align:center; color:#fff;">
        <h3 style="margin-bottom:8px;">Launching ${game.title}...</h3>
        <p style="color:var(--text-muted); font-size:13px;">Loading offline ROM from device storage</p>
      </div>`;

      // Try reading rom blob
      let blob = null;
      if (db) {
        blob = await new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          const reqKeys = store.getAllKeys();
          let keys = [];
          reqKeys.onsuccess = () => { keys = reqKeys.result; };
          req.onsuccess = () => {
            const vals = req.result;
            for (let i = 0; i < keys.length; i++) {
              if (String(keys[i]).endsWith(':' + game.id) || keys[i] === game.id || keys[i] === game.storageKey) {
                return resolve(vals[i]?.blob || vals[i] || null);
              }
            }
            resolve(null);
          };
          req.onerror = () => resolve(null);
        });
      }

      if (!blob && game.blob) {
        blob = game.blob;
      }

      if (!blob) {
        emuContainer.innerHTML = `<div style="color:var(--danger); padding:24px; text-align:center;">
          <p>Could not locate the downloaded ROM data for this game in device storage.</p>
          <button class="btn" style="margin-top:12px;" onclick="closeEmulator()">Back</button>
        </div>`;
        return;
      }

      emuContainer.innerHTML = `
        <div style="text-align:center; padding:24px; color:#fff;">
          <h2 style="font-size:18px; margin-bottom:12px;">🎮 ${game.title}</h2>
          <p style="color:var(--text-muted); margin-bottom:16px;">ROM Size: ${(blob.size / 1024 / 1024).toFixed(2)} MB &bull; Platform: ${game.console.toUpperCase()}</p>
          <p style="color:#10b981; font-weight:600; margin-bottom:20px;">✓ ROM verified and ready for offline play</p>
          <button class="btn btn-primary" onclick="window.location.href='/'">Switch to Full Arcade</button>
        </div>
      `;
    }

    function handleLocalRomPick(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const title = file.name.replace(/\.[^/.]+$/, '');
      const ext = file.name.split('.').pop().toLowerCase();
      let consoleName = 'nes';
      if (['sfc', 'smc'].includes(ext)) consoleName = 'snes';
      else if (['gba'].includes(ext)) consoleName = 'gba';
      else if (['gb', 'gbc'].includes(ext)) consoleName = 'gbc';
      else if (['md', 'gen'].includes(ext)) consoleName = 'genesis';

      const game = {
        id: 'local_' + Date.now(),
        title: title,
        console: consoleName,
        filename: file.name,
        sizeBytes: file.size,
        blob: file
      };

      // Save to IndexedDB
      if (db) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ blob: file, savedAt: Date.now() }, 'default:' + game.id);
      }

      showToast(`Loaded "${title}"`);
      launchGame(game);
      scanOfflineGames();
    }

    function closeEmulator() {
      document.getElementById('emulatorModal').classList.remove('active');
    }

    function reconnectToCloud() {
      window.location.href = 'https://games.butfree.online/';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      scanOfflineGames();
    });
  </script>
</body>
</html>
