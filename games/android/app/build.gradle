plugins {
    id 'com.android.application'
}

def bundledAssetsDir = layout.buildDirectory.dir('generated/freeplayAssets')

tasks.register('syncFreeplayAssets', Copy) {
    doFirst {
        delete bundledAssetsDir.get().asFile
    }
    from('../../server/dist') {
        into 'offline-site'
        exclude 'cores/**', 'freeplay.apk'
    }
    from('../../server/public/cores') {
        into 'cores'
    }
    into bundledAssetsDir
}

android {
    namespace 'online.butfree.freeplay'
    compileSdk 34

    defaultConfig {
        applicationId 'online.butfree.freeplay'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main.assets.srcDir(bundledAssetsDir)
    }

    androidResources {
        noCompress += ['wasm', 'zip']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncFreeplayAssets')
}
