plugins {
    id 'com.android.application'
}

android {
    namespace 'com.freevee.firetv'
    compileSdk 34

    defaultConfig {
        applicationId "com.freevee.firetv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
